<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高铁箱梁 3D 教学：从梁场到桥上</title>
<style>
:root{color-scheme:light;--ink:#26251f;--sub:#6b6a65;--line:#e2dfd6;--bg:#f7f6f2;--blue:#185fa5;--purple:#534ab7;--green:#0f6e56;--amber:#a5620f;--accent:#c8321e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.65 "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
#app{display:flex;height:100vh}
#view{position:relative;flex:1;min-width:0;overflow:hidden}
#view canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:opacity .25s}
.lb:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:rgba(0,0,0,.35)}
.lb.hl{background:#26251f;color:#fff;border-color:#26251f}
#stage{position:absolute;left:16px;top:14px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#stNo{display:inline-flex;min-width:28px;height:28px;border-radius:8px;color:#fff;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
#stName{font-size:16px;font-weight:600}
#stWhere{font-style:normal;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
#hint{position:absolute;right:14px;top:14px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:8px}
#bar{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
#chips button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
#chips button.on{color:#fff;border-color:transparent}
#ctrl{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;font-size:13px;color:var(--ink)}
.btn:hover{background:#f1efe8}
.btn.main{background:var(--ink);color:#fff;border-color:var(--ink);min-width:64px}
#tl{flex:1;position:relative;height:32px}
#tl input{position:absolute;inset:0;width:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
#track{position:absolute;left:0;right:0;top:13px;height:6px;border-radius:3px;background:#ebe8e0;overflow:hidden}
#fill{height:100%;width:0;background:var(--ink)}
.tick{position:absolute;top:9px;width:2px;height:14px;background:#cfcbc0}
select.btn{padding:0 6px}
#panel{width:390px;flex:none;border-left:1px solid var(--line);background:#fff;overflow-y:auto;padding:20px 22px 28px}
#panel h1{font-size:19px;margin:0 0 2px}
#panel .lead{color:var(--sub);font-size:13px;margin:0 0 14px}
#mode{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
#mode button{border:0;background:#fff;padding:5px 14px;cursor:pointer;font-size:13px;color:var(--sub)}
#mode button.on{background:var(--ink);color:#fff}
.card h2{font-size:18px;margin:0 0 4px}
.one{font-size:16px;font-weight:600;margin:6px 0 10px;padding:10px 12px;border-radius:10px;background:#f4f2ec}
.sec{font-size:12px;color:var(--sub);margin:14px 0 4px;letter-spacing:.5px}
.ph{list-style:none;padding:0;margin:0}
.ph li{padding:5px 10px 5px 26px;position:relative;border-radius:8px;color:var(--sub);cursor:pointer}
.ph li:before{content:"";position:absolute;left:10px;top:13px;width:7px;height:7px;border-radius:50%;background:#d3cfc4}
.ph li.done{color:var(--ink)}
.ph li.done:before{background:#8c8a82}
.ph li.cur{background:#f4f2ec;color:var(--ink);font-weight:600}
.ph li.cur:before{background:var(--accent)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums span{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:#fbfaf7}
.pro-only{display:none}
body.pro .pro-only{display:block}
.box{border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px}
.box.pro{background:#eef3fa;border:1px solid #d6e2f2}
.box.myth{background:#fbf3e6;border:1px solid #f0dfc2}
#info{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:none}
#info b{font-size:15px}
#info .x{float:right;cursor:pointer;color:var(--sub)}
.foot{margin-top:22px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px}
#quizBtn{width:100%;margin-top:14px;height:38px}
#quiz{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;align-items:center;justify-content:center;z-index:9}
#quiz .in{background:#fff;border-radius:16px;width:min(560px,92vw);max-height:86vh;overflow:auto;padding:22px 24px}
.q{margin:14px 0}
.q p{margin:0 0 6px;font-weight:600}
.q button{display:block;width:100%;text-align:left;margin:4px 0;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px}
.q button.ok{background:#e1f5ee;border-color:#9fd6c2}
.q button.no{background:#fbe9e6;border-color:#efb8ae}
.q .why{font-size:12px;color:var(--sub);display:none;margin-top:4px}
#score{font-weight:600;margin-top:10px}
#cap{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);max-width:min(860px,88%);text-align:center;font-size:20px;line-height:1.55;font-weight:500;color:#fff;background:rgba(22,22,20,.78);padding:10px 20px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);letter-spacing:.3px}
#cap:empty{display:none}
#cap.in{animation:capIn .35s ease}
@keyframes capIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
#cap .tm{font-weight:700;cursor:help;border-bottom:2px dotted currentColor}
body.nocap #cap{display:none}
.tg{font-size:12px;color:var(--sub)}
.tg.on{background:#26251f;color:#fff;border-color:#26251f}
#ovl{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(247,246,242,.55);backdrop-filter:blur(3px)}
#ovl .in{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 34px;max-width:520px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12)}
#ovl h2{margin:0 0 6px;font-size:24px}
#ovl p{color:var(--sub);margin:0 0 18px}
#ovl .big{height:46px;font-size:16px;padding:0 26px;border-radius:12px}
#ovl .alt{margin-left:10px}
#ovl small{display:block;margin-top:14px;color:var(--sub)}
body.nopanel #panel{display:none}
@media (max-width:900px){#app{flex-direction:column}#view{height:62vh;flex:none}#panel{width:auto;border-left:0;border-top:1px solid var(--line)}html,body{overflow:auto}#hint{display:none}}
</style></head><body>
<div id="app">
<div id="view">
<div id="labels"></div>
<div id="stage"><b id="stNo">0</b><span id="stName"></span><em id="stWhere"></em></div>
<div id="hint">拖动旋转 · 滚轮缩放 · 点设备看介绍 · 鼠标停在字幕彩色词上可定位部件</div>
<div id="cap"></div>
<div id="ovl"><div class="in" id="ovlIn"></div></div>
<div id="bar">
<div id="chips"></div>
<div id="ctrl">
<button class="btn" id="prev" title="上一步（←）">◀</button>
<button class="btn main" id="play">▶ 播放</button>
<button class="btn" id="next" title="下一步（→）">▶</button>
<div id="tl"><div id="track"><div id="fill"></div></div><div id="ticks"></div><input id="scrub" type="range" min="0" max="10000" value="0"></div>
<select class="btn" id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
<button class="btn" id="cam" title="回到推荐视角">推荐视角</button>
<button class="btn tg on" id="tVoice">旁白</button><button class="btn tg on" id="tSfx">音效</button><button class="btn tg on" id="tMus">音乐</button><button class="btn tg on" id="tCap">字幕</button><button class="btn tg on" id="tPanel">讲解卡</button>
</div>
</div>
</div>
<aside id="panel">
<h1>高铁箱梁：从梁场到桥上</h1>
<p class="lead">一孔 900 吨的梁怎么造出来、怎么运上桥。像看科普视频一样按播放，旁白会带你走完全程。也可以点任意一步。</p>
<div id="mode"><button data-m="0" class="on">小白版</button><button data-m="1">专业版</button></div>
<div class="card" id="card"></div>
<div id="info"><span class="x" id="infoX">✕</span><b id="infoT"></b><p id="infoD" style="margin:6px 0 0"></p></div>
<button class="btn main" id="quizBtn">看完了？做 6 道题自测</button>
<div class="foot">模型为教学示意，比例和动作做了简化。工艺参数取国内 32 米双线箱梁的常见做法，具体以设计文件和铁路规范为准。键盘：空格播放/暂停，← → 切换步骤。旁白用浏览器自带的中文语音，音色取决于系统。</div>
</aside>
</div>
<div id="quiz"><div class="in"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">自测：你真的看懂了吗</b><span class="btn" id="quizX" style="line-height:30px">关闭</span></div><div id="qs"></div><div id="score"></div></div></div>
<script>/*THREE*/</script>
<script>/*OC*/</script>
<script>/*APP*/</script>
</body></html>
